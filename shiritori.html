<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像しりとり</title>
    <style>
      .center{
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      .image-section img{
        width: 200px;
        height: 200px;
      }
    </style>
</head>


<body>
    <div class="center">
        <h1>画像しりとり</h1>
        <section class="image-section">
            <h2>シマエナガ</h2>
            <img src="images.jpg" alt="シマエナガの画像">
        </section>
         <section class="image-section">
            <h2>学生</h2>
            <img src="学生.jpg" alt="学生の画像">
        </section>
         <section class="image-section">
            <h2>石</h2>
            <img src="石.jpg" alt="石の画像">
        </section>
        
    </div>
    
</body>
</html>
